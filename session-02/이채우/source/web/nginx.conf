# WEB 계층 Nginx 설정 (/etc/nginx/nginx.conf 를 통째로 대체한다)
# 사용자 데이터가 아래 두 자리를 실제 값으로 바꾼다.
#   __APP_ALB__       → Internal ALB DNS 이름
#   __WEB_INSTANCE__  → 이 WEB의 인스턴스 ID와 AZ

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr ust=$upstream_status '
                    'xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;  # Public ALB 유휴 제한 시간(60초)보다 길게

    # ALB의 IP는 바뀔 수 있다. 도메인을 시작 시 한 번만 해석하지 않고
    # VPC DNS(Amazon 제공 DNS)로 30초마다 다시 조회한다.
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 80 default_server;
        server_name _;

        root /srv/portal/web/html;
        index index.html;

        # 어느 WEB이 응답했는지 화면과 watch 에서 확인하기 위한 헤더
        add_header X-Web-Instance "__WEB_INSTANCE__" always;

        # Public ALB 상태 검사용. WEB 프로세스 상태만 확인한다.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API 요청은 Internal ALB를 거쳐 APP으로 전달한다.
        location /api/ {
            set $app_upstream "http://__APP_ALB__";
            proxy_pass $app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js)$ {
            expires 5m;
        }
    }
}
